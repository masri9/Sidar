<title>TRIM GROUP — Your Brand. Your Booking App.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A090D;
    --panel: #16141C;
    --panel-2: #1D1A25;
    --gold: #D4AF37;
    --indigo: #6C5DFB;
    --white: #F5F3EE;
    --muted: #9C97AC;
    --border: rgba(245,243,238,0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--white); font-family: 'Manrope', sans-serif; overflow-x: hidden; }
  html[dir="rtl"] body, html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] h3, html[dir="rtl"] button, html[dir="rtl"] input, html[dir="rtl"] label {
    font-family: 'Tajawal', sans-serif;
  }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
  html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] h3 { font-weight: 800; }
  a { color: var(--gold); text-decoration: none; }
  a:hover { color: var(--indigo); }
  button { font-family: inherit; cursor: pointer; }
  img, svg { display: block; }
  .wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 40px; }
  .muted { color: var(--muted); }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .btn-primary {
    padding: 15px 28px; border-radius: 999px; background: var(--gold); color: #1A1508;
    font-size: 15px; font-weight: 700; border: none; display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 0 40px rgba(212,175,55,0.25);
  }
  .btn-secondary {
    padding: 15px 28px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    color: var(--white); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px;
  }
  .card { padding: 30px 26px; border-radius: 20px; background: var(--panel); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 16px; }
  .icon-badge { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 860px) {
    .grid-3 { grid-template-columns: 1fr; }
    .wrap { padding: 0 20px; }
    h1 { font-size: 40px !important; }
  }
  .lang-toggle {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.04);
    color: var(--white); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
  }
</style>
</head>

let currentLang = 'en';

function compareRow(trad, trim, isHeader) {
  if (isHeader) {
    return `<div class="grid-2" style="margin-bottom:14px;">
      <div style="padding:16px 22px; border-radius:16px; background:rgba(255,255,255,0.02); border:1px solid var(--border); text-align:center; font-weight:700; font-size:14px; color:var(--muted);">${trad}</div>
      <div style="padding:16px 22px; border-radius:16px; background:linear-gradient(135deg,rgba(212,175,55,0.1),rgba(108,93,251,0.1)); border:1px solid rgba(212,175,55,0.35); text-align:center; font-weight:700; font-size:14px; color:var(--gold);">${trim}</div>
    </div>`;
  }
  return `<div class="grid-2" style="margin-bottom:14px;">
    <div style="padding:20px 22px; border-radius:16px; background:var(--panel); border:1px solid var(--border); display:flex; align-items:center; gap:12px;">
      ${ICONS.cross}<span style="color:var(--muted); font-size:14px; font-weight:500;">${trad}</span>
    </div>
    <div style="padding:20px 22px; border-radius:16px; background:var(--panel-2); border:1px solid rgba(212,175,55,0.2); display:flex; align-items:center; gap:12px;">
      ${ICONS.check}<span style="font-size:14px; font-weight:600;">${trim}</span>
    </div>
  </div>`;
}

function featureCard(icon, title, desc, tint) {
  return `<div class="card">
    <div class="icon-badge" style="background:${tint === 'gold' ? 'rgba(212,175,55,0.12)' : 'rgba(108,93,251,0.12)'};">${ICONS[icon]}</div>
    <h3 style="font-size:18px; font-weight:700;">${title}</h3>
    <p style="font-size:14px; line-height:1.6; color:var(--muted); font-weight:500;">${desc}</p>
  </div>`;
}

function testimonialCard(item, tint) {
  return `<div class="card">
    <div style="align-self:flex-start; padding:6px 12px; border-radius:999px; background:${tint === 'gold' ? 'rgba(212,175,55,0.1)' : 'rgba(108,93,251,0.1)'}; color:${tint === 'gold' ? 'var(--gold)' : 'var(--indigo)'}; font-size:12px; font-weight:700;">${item.badge}</div>
    <p style="font-size:14px; line-height:1.65; font-weight:500;">"${item.quote}"</p>
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--indigo)); flex-shrink:0;"></div>
      <div>
        <div style="font-size:14px; font-weight:700;">${item.name}</div>
        <div style="font-size:12px; color:var(--muted); font-weight:500;">${item.role}</div>
      </div>
    </div>
  </div>`;
}

function render(lang) {
  currentLang = lang;
  const t = i18n[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.getElementById('nav-links').innerHTML = [t.nav.features, t.nav.customization, t.nav.automation, t.nav.pricing]
    .map(l => `<span style="color:var(--muted); font-size:14px; font-weight:600;">${l}</span>`).join('');
  document.getElementById('nav-login').textContent = t.nav.login;
  document.getElementById('nav-cta').textContent = t.nav.cta;

  document.getElementById('hero-eyebrow').textContent = t.hero.eyebrow;
  document.getElementById('hero-title-1').textContent = t.hero.title1;
  document.getElementById('hero-title-2').textContent = t.hero.title2;
  document.getElementById('hero-sub').textContent = t.hero.sub;
  document.getElementById('hero-cta-primary').textContent = t.hero.ctaPrimary;
  document.getElementById('hero-cta-secondary-text').textContent = t.hero.ctaSecondary;
  document.getElementById('mockup-name').textContent = t.hero.mockupName;

  document.getElementById('manifesto-eyebrow').textContent = t.manifesto.eyebrow;
  document.getElementById('manifesto-title').textContent = t.manifesto.title;
  document.getElementById('compare-rows').innerHTML = compareRow(t.manifesto.colTrad, t.manifesto.colTrim, true) +
    t.manifesto.rows.map(r => compareRow(r[0], r[1], false)).join('');

  document.getElementById('customization-eyebrow').textContent = t.customization.eyebrow;
  document.getElementById('customization-title').textContent = t.customization.title;
  document.getElementById('customization-sub').textContent = t.customization.sub;
  document.getElementById('customization-cards').innerHTML = t.customization.cards
    .map((c, i) => featureCard(c.icon, c.title, c.desc, i % 2 === 0 ? 'gold' : 'indigo')).join('');

  document.getElementById('automation-eyebrow').textContent = t.automation.eyebrow;
  document.getElementById('automation-title').textContent = t.automation.title;
  document.getElementById('automation-cards').innerHTML = t.automation.cards
    .map((c, i) => featureCard(c.icon, c.title, c.desc, i % 2 === 0 ? 'indigo' : 'gold')).join('');

  document.getElementById('testimonials-eyebrow').textContent = t.testimonials.eyebrow;
  document.getElementById('testimonials-title').textContent = t.testimonials.title;
  document.getElementById('testimonial-cards').innerHTML = t.testimonials.items
    .map((it, i) => testimonialCard(it, i % 2 === 0 ? 'gold' : 'indigo')).join('');

  document.getElementById('finalcta-title').textContent = t.finalcta.title;
  document.getElementById('finalcta-sub').textContent = t.finalcta.sub;
  document.getElementById('finalcta-label').textContent = t.finalcta.label;
  document.getElementById('bizname').placeholder = t.finalcta.placeholder;
  document.getElementById('finalcta-button').textContent = t.finalcta.button;

  document.getElementById('footer-tagline').textContent = t.footer.tagline;
  document.getElementById('footer-privacy').textContent = t.footer.privacy;
  document.getElementById('footer-terms').textContent = t.footer.terms;
  document.getElementById('footer-contact').textContent = t.footer.contact;
}

document.getElementById('lang-toggle').addEventListener('click', () => {
  render(currentLang === 'en' ? 'ar' : 'en');
});

render('en');
</script>
</body>
</html>
