<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كليك | Klick - رحلات اقتصادية</title>
    
    <!-- مكتبة Tailwind CSS للتنسيق السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- خط Tajawal من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#00FF66', // اللون النيون الأخضر الخاص بكليك
                        darkBg: '#070A0F',
                        cardBg: '#0B0F17'
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 font-sans min-h-screen flex flex-col justify-between max-w-md mx-auto border-x border-slate-800">

    <!-- 1. الهيدر الشفاف (Header) -->
    <header class="sticky top-0 z-30 backdrop-blur-md bg-cardBg/80 border-b border-slate-800 p-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-brand/10 border border-brand/40 flex items-center justify-center shadow-[0_0_10px_#00FF66]">
                <span class="text-brand font-bold text-sm">K</span>
            </div>
            <h1 class="text-lg font-black tracking-wider text-white">كليك <span class="text-brand text-xs">KLICK</span></h1>
        </div>
        <button class="px-3 py-1 text-xs rounded-full bg-slate-800 border border-slate-700 text-brand font-semibold">
            English
        </button>
    </header>

    <!-- 2. المحتوى الرئيسي (Main Content) -->
    <main class="p-4 space-y-5 flex-1">
        
        <!-- كارت حالة الرحلة (Flight Status) -->
        <section class="bg-cardBg/90 rounded-2xl p-4 border border-slate-800 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-xs text-slate-400 font-bold">رحلة رقم: <strong class="text-brand">KC-882</strong></span>
                <span class="text-xs bg-brand/10 text-brand px-2 py-0.5 rounded-full border border-brand/30">مباشر</span>
            </div>

            <!-- محطة المغادرة والوصول -->
            <div class="flex justify-between items-center text-center">
                <div>
                    <h2 class="text-2xl font-black text-white">JED</h2>
                    <p class="text-[10px] text-slate-400">جدة</p>
                    <p class="text-xs text-brand font-bold mt-1">08:30 ص</p>
                </div>
                
                <div class="flex-1 px-4 relative">
                    <div class="border-b-2 border-dashed border-slate-700 w-full my-2"></div>
                    <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-cardBg text-brand p-1 rounded-full border border-brand shadow-[0_0_10px_#00FF66]">
                        ✈️
                    </span>
                </div>

                <div>
                    <h2 class="text-2xl font-black text-white">LHR</h2>
                    <p class="text-[10px] text-slate-400">لندن</p>
                    <p class="text-xs text-brand font-bold mt-1">04:15 م</p>
                </div>
            </div>
        </section>

        <!-- بطاقة تفاعلية / تنبيه -->
        <section class="p-4 rounded-2xl bg-gradient-to-r from-emerald-950 to-slate-900 border border-brand/20 flex justify-between items-center">
            <div>
                <h3 class="text-sm font-bold text-white">مساعد كليك الذكي</h3>
                <p class="text-xs text-slate-400">استفسر عن الأمتعة، الفنادق والترانزيت</p>
            </div>
            <button class="bg-brand text-black px-3 py-1.5 rounded-xl font-bold text-xs shadow-[0_0_10px_#00FF66]">
                تحدث مع AI
            </button>
        </section>

    </main>

    <!-- 3. شريط التنقل السفلي (Bottom Navigation) -->
    <nav class="sticky bottom-0 bg-cardBg/90 backdrop-blur-lg border-t border-slate-800 p-3 flex justify-around text-center text-xs text-slate-400">
        <a href="#" class="text-brand flex flex-col items-center gap-1 font-bold">
            <span>🏠</span>
            <span>الرئيسية</span>
        </a>
        <a href="#" class="hover:text-white flex flex-col items-center gap-1">
            <span>✈️</span>
            <span>رحلاتي</span>
        </a>
        <a href="#" class="hover:text-white flex flex-col items-center gap-1">
            <span>🤖</span>
            <span>مساعد AI</span>
        </a>
    </nav>

</body>
</html>
