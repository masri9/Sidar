const LanguageContext = createContext(null);
function LanguageProvider({ children }) {
  const [locale, setLocale] = useState(() => localStorage.getItem("klick-locale") || "ar");
  const dir = locale === "ar" ? "rtl" : "ltr";
  useEffect(() => { 
    document.documentElement.dir = dir; 
    document.documentElement.lang = locale; 
    document.body.dir = dir; 
    localStorage.setItem("klick-locale", locale); 
  }, [locale, dir]);
  const value = useMemo(() => ({ locale, dir, t: (k) => dict[locale][k] || k, setLocale, toggleLocale: () => setLocale(l => l === "ar" ? "en" : "ar") }), [locale, dir]);
  return <LanguageContext.Provider value={value}>{children}</LanguageContext.Provider>;
}
const useLanguage = () => useContext(LanguageContext);

--------------------------------------------------------- */

const phaseKey = { confirmed:"confirmed", at_airport:"atAirport", in_flight:"inFlight", transit:"transit", arrived:"arrived" };
function isAdminPhone(phone) {
  const digits = phone.replace(/[^\d]/g, "").replace(/^00/, "");
  return digits.startsWith("9") || phone.trim().replace("+","").startsWith("9");
}

/* ---------------------------------------------------------
   Auth context
--------------------------------------------------------- */
const AuthContext = createContext(null);
function AuthProvider({ children }) {
  const [users, setUsers] = useState(initialUsers);
  const [trips, setTrips] = useState(initialTrips);
  const [user, setUser] = useState(() => {
    const stored = localStorage.getItem("klick-current-user");
    return stored ? JSON.parse(stored) : null;
  });
  const persist = (next) => { setUser(next); if (next) localStorage.setItem("klick-current-user", JSON.stringify(next)); else localStorage.removeItem("klick-current-user"); };
  const loginWithPhone = (phone) => {
    const existing = users.find(u => u.phone === phone);
    if (existing) { persist(existing); return; }
    const newUser = { id:"u_"+Date.now(), phone, firstName:"Traveler", lastName:"", isAdmin:isAdminPhone(phone) };
    setUsers(u => [...u, newUser]);
    persist(newUser);
  };
  const updateProfile = (patch) => {
    if (!user) return;
    const next = { ...user, ...patch };
    if (patch.phone) next.isAdmin = isAdminPhone(patch.phone);
    setUsers(list => list.map(u => u.id === user.id ? next : u));
    persist(next);
  };
  const logout = () => persist(null);
  const value = { user, users, setUsers, trips, setTrips, isAdmin: !!user?.isAdmin, loginWithPhone, updateProfile, logout };
  return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
}
const useAuth = () => useContext(AuthContext);

function SideDrawer({ open, onClose, page, setPage }) {

/* ---------------------------------------------------------
   Flight Status Tracker
--------------------------------------------------------- */
function FlightStatusTracker({ status, compact }) {
  const { t } = useLanguage();
  const currentIndex = FLIGHT_PHASES.indexOf(status);
  return (
    <div className="glass-panel rounded-2xl p-4">
      {!compact && <p className="mb-4 text-sm font-semibold text-white/60">{t("flightStatus")}</p>}
      <div className="flex items-center">
        {FLIGHT_PHASES.map((phase, i) => {
          const reached = i <= currentIndex;
          const isCurrent = i === currentIndex;
          const isLast = i === FLIGHT_PHASES.length - 1;
          return (
            <div key={phase} className="flex flex-1 items-center last:flex-none">
              <div className="flex flex-col items-center gap-2">
                <span className={`block h-3.5 w-3.5 rounded-full border ${reached ? "border-[#00FF66] bg-[#00FF66]" : "border-white/15 bg-[#141A22]"} ${isCurrent ? "animate-pulse-glow" : ""}`} />
                {!compact && <span className={`whitespace-nowrap text-[10px] ${reached ? "text-[#00FF66]" : "text-white/40"}`}>{t(phaseKey[phase])}</span>}
              </div>
              {!isLast && (
                <div className="mx-1 h-px flex-1 bg-white/10">
                  <div className="h-px bg-[#00FF66] transition-all duration-700" style={{ width: reached ? "100%" : "0%" }} />
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

      </div>
      <div className="absolute bottom-3 left-1/2 flex -translate-x-1/2 gap-1.5">
        {banners.map((b, i) => (
          <button key={b.id} aria-label={`Slide ${i+1}`} onClick={() => setIndex(i)} className={`h-1.5 rounded-full transition-all ${i === index ? "w-5 bg-[#00FF66]" : "w-1.5 bg-white/40"}`} />
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Community Feed
--------------------------------------------------------- */
function PostCard({ post }) {
  const [liked, setLiked] = useState(false);
  const [likes, setLikes] = useState(post.likes);
  return (
    <article className="glass-panel overflow-hidden rounded-2xl">
      <img src={post.imageUrl} alt="" className="h-52 w-full object-cover" />
      <div className="p-4">
        <div className="flex items-center gap-2">
          <img src={post.authorAvatar} alt="" className="h-8 w-8 rounded-full object-cover ring-1 ring-[#00FF66]/40" />
          <div>
            <p className="text-sm font-semibold">{post.authorName}</p>
            {post.location && <p className="flex items-center gap-1 text-[11px] text-white/50"><Icon path={I.pin} size={11} />{post.location}</p>}
          </div>
        </div>
        <p className="mt-3 text-sm text-white/90">{post.caption}</p>
        <button onClick={() => { setLiked(v=>!v); setLikes(n => liked ? n-1 : n+1); }} className="mt-3 flex items-center gap-1.5 text-sm">
          <Icon path={I.heart} size={17} filled={liked} className={liked ? "text-[#00FF66]" : "text-white/50"} />
          <span className={liked ? "text-[#00FF66]" : "text-white/50"}>{likes}</span>
        </button>
      </div>
    </article>
  );
}

function CommunityFeed() {
  const { t } = useLanguage();
  return (
    <section>
      <div className="mb-3 flex items-center justify-between">
        <h2 className="font-display text-base font-bold">{t("communityFeed")}</h2>
        <button className="flex items-center gap-1 rounded-lg border border-[#00FF66]/40 px-2.5 py-1.5 text-xs font-semibold text-[#00FF66]">
          <Icon path={I.plus} size={14} />{t("sharePost")}
        </button>
      </div>
      <div className="flex flex-col gap-4">{posts.map(p => <PostCard key={p.id} post={p} />)}</div>
    </section>
  );
}

/* ---------------------------------------------------------
   Flight Card — curved arc track + animated plane
--------------------------------------------------------- */
function formatTime(iso){ return new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
function formatDate(iso){ return new Date(iso).toLocaleDateString(undefined, {month:"short",day:"numeric"}); }

function ArcTrack() {
  const pathD = "M 12 44 Q 150 -14 288 44";
  return (
    <div className="relative h-14 w-full">
      <svg viewBox="0 0 300 44" className="h-full w-full overflow-visible" preserveAspectRatio="none">
        <path d={pathD} fill="none" stroke="#1F2A2E" strokeWidth="2" strokeDasharray="1 8" strokeLinecap="round" />
        <path d={pathD} fill="none" stroke="#00FF66" strokeWidth="2" strokeDasharray="1 8" strokeLinecap="round" className="animate-dash-move" opacity="0.9" />
      </svg>
      <div className="plane-marker absolute left-0 top-0 h-4 w-4" style={{ offsetPath: `path("${pathD}")` }}>
        <Icon path={I.plane} size={16} className="text-[#00FF66] drop-shadow-[0_0_6px_#00FF66]" />
      </div>
    </div>
  );
}

function FlightCard({ legs, status, bookingReference }) {
  const { t } = useLanguage();
  return (
    <div className="glass-panel rounded-3xl p-5">
      <div className="mb-4 flex items-center justify-between text-xs text-white/50">
        <span>{bookingReference}</span>
        <span>{legs.length > 1 ? `${legs.length - 1} ${t("transitAt").toLowerCase()}` : t("flight")} {legs[0].flightNumber}</span>
      </div>
      {legs.map((leg, idx) => (
        <div key={leg.id} className={idx > 0 ? "mt-5 border-t border-white/10 pt-5" : ""}>
          <div className="flex items-center justify-between">
            <div className="text-start">
              <p className="font-display text-2xl font-extrabold">{leg.departureAirport}</p>
              <p className="text-xs text-white/50">{leg.departureCity}</p>
              <p className="mt-1 text-sm font-medium text-[#00FF66]">{formatTime(leg.departureTime)}</p>
            </div>
            <div className="flex-1 px-3"><ArcTrack /></div>
            <div className="text-end">
              <p className="font-display text-2xl font-extrabold">{leg.arrivalAirport}</p>
              <p className="text-xs text-white/50">{leg.arrivalCity}</p>
              <p className="mt-1 text-sm font-medium text-[#00FF66]">{formatTime(leg.arrivalTime)}</p>
            </div>
          </div>
          <div className="mt-3 flex items-center justify-between text-xs text-white/50">
            <span>{t("flight")} <span className="text-white">{leg.flightNumber}</span></span>
            <span>{formatDate(leg.departureTime)}</span>
            {leg.seat && <span>{t("seat")} <span className="text-white">{leg.seat}</span></span>}
          </div>
          {leg.transit && (
            <div className="mt-3 flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs text-white/60">
              <Icon path={I.clock} size={14} className="text-[#00FF66]" />
              {t("transitAt")} {leg.transit.airport} · {Math.floor(leg.transit.durationMinutes/60)}h {leg.transit.durationMinutes % 60}m
            </div>
          )}
        </div>
      ))}
      <div className="mt-5"><FlightStatusTracker status={status} compact /></div>
    </div>
  );
}

/* ---------------------------------------------------------
   Phone Login
--------------------------------------------------------- */
const COUNTRY_CODES = [
  { code:"+962", label:"🇯🇴 +962" }, { code:"+966", label:"🇸🇦 +966" }, { code:"+971", label:"🇦🇪 +971" },
  { code:"+20", label:"🇪🇬 +20" }, { code:"+1", label:"🇺🇸 +1" }, { code:"+44", label:"🇬🇧 +44" },
];

function PhoneLogin() {
  const { t } = useLanguage();
  const { loginWithPhone } = useAuth();
  const [cc, setCc] = useState(COUNTRY_CODES[0].code);
  const [num, setNum] = useState("");
  const submit = (e) => { e.preventDefault(); if (!num.trim()) return; loginWithPhone(`${cc}${num.replace(/\D/g,"")}`); };
  return (
    <div className="glass-panel mx-auto mt-10 max-w-sm rounded-3xl p-6">
      <h1 className="font-display text-xl font-bold text-gradient-neon">{t("loginTitle")}</h1>
      <p className="mt-1 text-sm text-white/50">{t("loginSubtitle")}</p>
      <form onSubmit={submit} className="mt-6 flex flex-col gap-4">
        <div className="flex gap-2">
          <select value={cc} onChange={e=>setCc(e.target.value)} className="rounded-xl border border-white/10 bg-[#141A22] px-2 py-3 text-sm focus:border-[#00FF66]">
            {COUNTRY_CODES.map(c => <option key={c.code} value={c.code}>{c.label}</option>)}
          </select>
          <input value={num} onChange={e=>setNum(e.target.value)} inputMode="numeric" placeholder="79 123 4567"
            className="flex-1 rounded-xl border border-white/10 bg-[#141A22] px-3 py-3 text-sm placeholder:text-white/30 focus:border-[#00FF66]" />
        </div>
        <p className="text-[11px] text-white/40">{t("language") === "Language" ? "Tip: numbers starting with 9 unlock the admin dashboard." : "تلميح: الأرقام التي تبدأ بـ 9 تفتح لوحة تحكم المشرف."}</p>
        <button type="submit" className="rounded-xl bg-[#00FF66] py-3 text-sm font-bold text-black shadow-neon transition hover:brightness-110 active:scale-[0.98]">{t("continueLabel")}</button>
      </form>
    </div>
  );
}

/* ---------------------------------------------------------
   Pages
--------------------------------------------------------- */
function HomePage() {
  const { t } = useLanguage();
  const { user, trips } = useAuth();
  const myTrip = trips.find(tr => tr.userId === user.id) || trips[0];
  return (
    <div className="flex flex-col gap-6">
      <div>
        <p className="text-sm text-white/50">{t("welcomeBack")}</p>
        <h1 className="font-display text-2xl font-extrabold">{user.firstName} {user.lastName}</h1>
      </div>
      {myTrip && <FlightStatusTracker status={myTrip.status} />}
      <PromoCarousel />
      <CommunityFeed />
    </div>
  );
}

function TripsPage() {
  const { t } = useLanguage();
  const { user, trips } = useAuth();
  const myTrips = trips.filter(tr => tr.userId === user.id);
  return (
    <div className="flex flex-col gap-5">
      <h1 className="font-display text-xl font-bold">{t("myTrips")}</h1>
      {myTrips.length === 0 && <p className="text-sm text-white/50">{t("noTrips")}</p>}
      {myTrips.map(trip => <FlightCard key={trip.id} legs={trip.legs} status={trip.status} bookingReference={trip.bookingReference} />)}
    </div>
  );
}

function SupportPage() {
  const { t } = useLanguage();
  const [messages, setMessages] = useState([{ id:1, role:"assistant", text:"Hi! Ask me anything about your booking, baggage, or flight status." }]);
  const [input, setInput] = useState("");
  const send = (e) => {
    e.preventDefault();
    if (!input.trim()) return;
    const userMsg = { id: Date.now(), role:"user", text: input };
    const reply = { id: Date.now()+1, role:"assistant", text: "Thanks — a Klick travel specialist will follow up shortly. For urgent flight changes, check the Status tracker on Home." };
    setMessages(m => [...m, userMsg, reply]);
    setInput("");
  };
  return (
    <div className="flex h-[70vh] flex-col">
      <h1 className="font-display mb-3 text-xl font-bold">{t("aiSupport")}</h1>
      <div className="glass-panel flex-1 overflow-y-auto rounded-2xl p-4">
        <div className="flex flex-col gap-3">
          {messages.map(m => (
            <div key={m.id} className={`max-w-[80%] rounded-2xl px-3 py-2 text-sm ${m.role === "user" ? "self-end bg-[#00FF66]/15 text-[#00FF66]" : "self-start bg-white/5 text-white/85"}`}>
              {m.text}
            </div>
          ))}
        </div>
      </div>
      <form onSubmit={send} className="mt-3 flex gap-2">
        <input value={input} onChange={e=>setInput(e.target.value)} placeholder={t("askAi")}
          className="flex-1 rounded-xl border border-white/10 bg-[#141A22] px-3 py-3 text-sm placeholder:text-white/30 focus:border-[#00FF66]" />
        <button type="submit" className="flex h-11 w-11 items-center justify-center rounded-xl bg-[#00FF66] text-black shadow-neon-sm">
          <Icon path={I.send} size={18} />
        </button>
      </form>
    </div>
  );
}

function ProfilePage() {
  const { t } = useLanguage();
  const { user, updateProfile } = useAuth();
  const [firstName, setFirstName] = useState(user.firstName);
  const [lastName, setLastName] = useState(user.lastName);
  const [phone, setPhone] = useState(user.phone);
  const [savedFlash, setSavedFlash] = useState(false);
  const save = (e) => { e.preventDefault(); updateProfile({ firstName, lastName, phone }); setSavedFlash(true); setTimeout(()=>setSavedFlash(false), 1800); };
  return (
    <div className="flex flex-col gap-5">
      <h1 className="font-display text-xl font-bold">{t("editProfile")}</h1>
      <div className="glass-panel rounded-3xl p-5">
        <div className="flex items-center gap-3">
          <img src={user.avatarUrl || "https://api.dicebear.com/7.x/initials/svg?seed=" + firstName} alt="" className="h-16 w-16 rounded-full object-cover ring-2 ring-[#00FF66]/40" />
          {user.isAdmin && <span className="rounded-full border border-[#00FF66]/40 bg-[#00FF66]/10 px-2 py-1 text-[11px] font-semibold text-[#00FF66]">{t("superAdmin")}</span>}
        </div>
        <form onSubmit={save} className="mt-5 flex flex-col gap-3">
          <label className="text-xs text-white/50">{t("firstName")}
            <input value={firstName} onChange={e=>setFirstName(e.target.value)} className="mt-1 w-full rounded-xl border border-white/10 bg-[#141A22] px-3 py-2.5 text-sm focus:border-[#00FF66]" />
          </label>
          <label className="text-xs text-white/50">{t("lastName")}
            <input value={lastName} onChange={e=>setLastName(e.target.value)} className="mt-1 w-full rounded-xl border border-white/10 bg-[#141A22] px-3 py-2.5 text-sm focus:border-[#00FF66]" />
          </label>
          <label className="text-xs text-white/50">{t("phoneNumber")}
            <input value={phone} onChange={e=>setPhone(e.target.value)} className="mt-1 w-full rounded-xl border border-white/10 bg-[#141A22] px-3 py-2.5 text-sm focus:border-[#00FF66]" />
          </label>
          <button type="submit" className="mt-2 rounded-xl bg-[#00FF66] py-3 text-sm font-bold text-black shadow-neon-sm transition hover:brightness-110">
            {savedFlash ? t("saved") : t("save")}
          </button>
        </form>
      </div>
    </div>
  );
}

function AdminPage() {
  const { t } = useLanguage();
  const { users, trips, setTrips, isAdmin } = useAuth();
  const [query, setQuery] = useState("");
  const [selectedUserId, setSelectedUserId] = useState(null);

  if (!isAdmin) return <p className="text-sm text-white/50">Not authorized.</p>;

  const filtered = users.filter(u => u.phone.includes(query));
  const selectedTrip = trips.find(tr => tr.userId === selectedUserId);

  const setStatus = (phase) => {
    if (!selectedUserId) return;
    setTrips(list => list.map(tr => tr.userId === selectedUserId ? { ...tr, status: phase } : tr));
  };

  const removeTrip = (tripId) => setTrips(list => list.filter(tr => tr.id !== tripId));

  return (
    <div className="flex flex-col gap-6">
      <h1 className="font-display text-xl font-bold text-gradient-neon">{t("adminDashboard")}</h1>

      <div className="glass-panel rounded-2xl p-4">
        <p className="mb-2 text-sm font-semibold text-white/70">{t("manageUsers")}</p>
        <div className="flex items-center gap-2 rounded-xl border border-white/10 bg-[#141A22] px-3 py-2">
          <Icon path={I.search} size={16} className="text-white/40" />
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder={t("searchByPhone")} className="flex-1 bg-transparent text-sm focus:outline-none" />
        </div>
        <div className="mt-3 flex flex-col gap-2">
          {filtered.length === 0 && <p className="text-xs text-white/40">{t("noResults")}</p>}
          {filtered.map(u => (
            <button key={u.id} onClick={() => setSelectedUserId(u.id)}
              className={`flex items-center justify-between rounded-xl border px-3 py-2 text-sm transition ${selectedUserId === u.id ? "border-[#00FF66]/50 bg-[#00FF66]/10 text-[#00FF66]" : "border-white/10 bg-white/5 text-white/80"}`}>
              <span>{u.firstName} {u.lastName} · {u.phone}</span>
              {u.isAdmin && <Icon path={I.shield} size={14} />}
            </button>
          ))}
        </div>
      </div>

      {selectedUserId && (
        <div className="glass-panel rounded-2xl p-4">
          <p className="mb-3 text-sm font-semibold text-white/70">{t("statusTracker")}</p>
          <div className="flex flex-wrap gap-2">
            {FLIGHT_PHASES.map(phase => (
              <button key={phase} onClick={() => setStatus(phase)}
                className={`rounded-lg border px-3 py-1.5 text-xs font-medium transition ${selectedTrip?.status === phase ? "border-[#00FF66] bg-[#00FF66]/15 text-[#00FF66] shadow-neon-sm" : "border-white/10 text-white/60 hover:border-white/30"}`}>
                {t(phaseKey[phase])}
              </button>
            ))}
          </div>

          <p className="mb-2 mt-5 text-sm font-semibold text-white/70">{t("manageFlights")}</p>
          {!selectedTrip && <p className="text-xs text-white/40">{t("noTrips")}</p>}
          {selectedTrip && (
            <div className="flex flex-col gap-2">
              {selectedTrip.legs.map(leg => (
                <div key={leg.id} className="flex items-center justify-between rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs">
                  <span>{leg.flightNumber} · {leg.departureAirport} → {leg.arrivalAirport} · {t("seat")} {leg.seat}</span>
                </div>
              ))}
              <button onClick={() => removeTrip(selectedTrip.id)} className="mt-1 flex w-fit items-center gap-1 rounded-lg border border-red-500/30 px-2.5 py-1.5 text-xs text-red-400 hover:bg-red-500/10">
                <Icon path={I.trash} size={13} />Remove trip
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   App Shell
--------------------------------------------------------- */
function AppShell() {
  const [showSplash, setShowSplash] = useState(true);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [page, setPage] = useState("home");
  const { user } = useAuth();

  useEffect(() => { const timer = setTimeout(() => setShowSplash(false), 2500); return () => clearTimeout(timer); }, []);

  if (showSplash) return <SplashScreen />;

  if (!user) {
    return (
      <div className="flex min-h-screen flex-col">
        <Header onOpenMenu={() => {}} />
        <main className="mx-auto w-full max-w-md flex-1 px-4 pb-10 pt-4 sm:max-w-2xl"><PhoneLogin /></main>
      </div>
    );
  }

  const pages = { home:<HomePage/>, trips:<TripsPage/>, support:<SupportPage/>, profile:<ProfilePage/>, admin:<AdminPage/> };

  return (
    <div className="flex min-h-screen flex-col">
      <Header onOpenMenu={() => setDrawerOpen(true)} />
      <SideDrawer open={drawerOpen} onClose={() => setDrawerOpen(false)} page={page} setPage={setPage} />
      <main className="mx-auto w-full max-w-md flex-1 px-4 pb-24 pt-4 sm:max-w-2xl">{pages[page] || pages.home}</main>
      <BottomNav page={page} setPage={setPage} />
    </div>
  );
}

function App() {
  return (
    <LanguageProvider>
      <AuthProvider>
        <AppShell />
      </AuthProvider>
    </LanguageProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
