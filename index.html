<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlanta's Best Barber</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-dark: #0d0d0d;
    --bg-charcoal: #2b2b2b;
    --gold: #c9a24b;
    --gold-soft: #e4c98a;
    --ivory: #f3ede1;
    --line: rgba(243,237,225,0.16);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    font-family:'Inter', sans-serif;
    color:var(--ivory);
    background:
      radial-gradient(circle at 50% 35%, var(--bg-charcoal) 0%, var(--bg-dark) 65%, #050505 100%);
    min-height:100vh;
    overflow-x:hidden;
  }

  a{ color:inherit; text-decoration:none; }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:2.5rem 1.5rem 1.5rem;
  }

  .logo{
    font-family:'UnifrakturMaguntia', serif;
    font-size:2.4rem;
    color:var(--gold-soft);
    letter-spacing:1px;
  }

  nav{
    margin-top:1.6rem;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:2.2rem;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:0.9rem 1rem;
  }

  nav a{
    font-size:0.72rem;
    letter-spacing:0.18em;
    color:var(--ivory);
    opacity:0.8;
    transition:opacity 0.2s ease, color 0.2s ease;
  }

  nav a:hover{ opacity:1; color:var(--gold-soft); }

  /* ---------- HERO ---------- */
  .hero{
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:3rem;
    max-width:1200px;
    margin:3.5rem auto 5rem;
    padding:0 2rem;
  }

  .hero-copy .eyebrow{
    font-size:0.75rem;
    letter-spacing:0.22em;
    color:var(--gold);
    margin-bottom:1.1rem;
    display:block;
  }

  .hero-copy h1{
    font-family:'Montserrat', sans-serif;
    font-weight:800;
    font-size:clamp(2.4rem, 5vw, 4.2rem);
    line-height:1.05;
    color:var(--ivory);
  }

  .hero-copy .cta{
    display:inline-block;
    margin-top:2.2rem;
    font-size:0.85rem;
    letter-spacing:0.14em;
    color:var(--gold-soft);
    border-bottom:1px solid var(--gold-soft);
    padding-bottom:4px;
    transition:color 0.2s ease, border-color 0.2s ease;
  }

  .hero-copy .cta:hover{ color:var(--ivory); border-color:var(--ivory); }

  /* Layered photo collage */
  .collage{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
  }

  .collage .frame{
    border:6px solid var(--ivory);
    box-shadow:0 20px 45px rgba(0,0,0,0.5);
    overflow:hidden;
  }

  .collage img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .collage .top{
    position:absolute;
    top:0;
    right:0;
    width:68%;
    height:60%;
    z-index:2;
  }

  .collage .bottom{
    position:absolute;
    bottom:0;
    left:0;
    width:62%;
    height:58%;
    z-index:1;
  }

  /* ---------- ICON MENU ---------- */
  .looking-for{
    text-align:center;
    padding:0 1.5rem 5rem;
  }

  .looking-for h2{
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:0.85rem;
    letter-spacing:0.25em;
    color:var(--ivory);
    opacity:0.85;
    margin-bottom:3rem;
  }

  .icon-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:2.6rem;
    max-width:900px;
    margin:0 auto;
  }

  .icon-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.9rem;
    width:110px;
  }

  .icon-circle{
    width:72px;
    height:72px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color 0.2s ease, transform 0.2s ease;
  }

  .icon-item:hover .icon-circle{
    border-color:var(--gold-soft);
    transform:translateY(-3px);
  }

  .icon-circle svg{
    width:26px;
    height:26px;
    stroke:var(--gold-soft);
    fill:none;
    stroke-width:1.6;
  }

  .icon-item span{
    font-size:0.68rem;
    letter-spacing:0.12em;
    color:var(--ivory);
    opacity:0.75;
    text-align:center;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 860px){
    .hero{
      grid-template-columns:1fr;
      text-align:center;
      margin-top:2rem;
    }
    .hero-copy .eyebrow{ text-align:center; }
    .collage{
      max-width:420px;
      margin:0 auto;
      aspect-ratio:4/3;
    }
    nav{ gap:1.2rem 1.6rem; }
  }

  @media (max-width: 480px){
    .logo{ font-size:1.9rem; }
    nav a{ font-size:0.65rem; }
    .icon-item{ width:84px; }
    .icon-circle{ width:60px; height:60px; }
    .icon-circle svg{ width:22px; height:22px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">mhmed barber</div>
  <nav>
    <a href="#work">اعمالي</a>
    <a href="#hours">ساعات العمل</a>
    <a href="#book">احجز الآن</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-copy">
    <span class="eyebrow">YOUR COMPANY NAME</span>
    <h1>ATLANTA'S BEST<br>BARBER.</h1>
    <a href="#book" class="cta">BOOK TODAY</a>
  </div>

  <div class="collage">
    <div class="frame top">
      <img src="https://plain-eeur-prod-public.komododecks.com/202609/14/OpKbv9BQOJrZ7FmDnSBp/image.jpg" alt="Barber at work, top photo">
    </div>
    <!-- Bottom photo -->
    <div class="frame bottom">
      <img src="https://plain-eeur-prod-public.komododecks.com/202609/14/xuD32Tvn13s7sgWPEzNV/image.jpg" alt="Barbershop interior, bottom photo">
    </div>
  </div>
</section>

<section class="looking-for">
  <h2>WHAT ARE YOU LOOKING FOR TODAY?</h2>
  <div class="icon-grid">

    <div class="icon-item">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24"><path d="M2 12l4-4 3 3 5-5 4 4M2 12v6a2 2 0 0 0 2 2h4M22 12v6a2 2 0 0 1-2 2h-4"/></svg>
      </div>
      <span>MEET ME</span>
    </div>

    <div class="icon-item">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24"><path d="M4 4h11a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V4z"/><path d="M17 4h1a2 2 0 0 1 2 2v14"/></svg>
      </div>
      <span>MY STORY</span>
    </div>

    <div class="icon-item">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.5 15.5M14.5 14.5L20 20M8.5 8.5L14.5 14.5"/></svg>
      </div>
      <span>MY WORK</span>
    </div>

    <div class="icon-item">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24"><path d="M12 3v18M16 7.5c0-1.7-1.8-3-4-3s-4 1.3-4 3 1.8 2.6 4 3 4 1.3 4 3-1.8 3-4 3-4-1.3-4-3"/></svg>
      </div>
      <span>PRICING</span>
    </div>

    <div class="icon-item">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      </div>
      <span>BOOK NOW</span>
    </div>

    <div class="icon-item">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg>
      </div>
      <span>OUR HOURS</span>
    </div>

  </div>
</section>

</body>
</html>
