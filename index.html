<!DOCTYPE html>
<html lang="ar" dir="rtl" x-data="travelApp()" x-init="initApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX - MVP</title>
    <!-- Tailwind CSS لضمان التصميم العصري الرقمي -->
    <script src="https://jsdelivr.net"></script>
    <!-- Alpine.js لإدارة التفاعلات والترجمة الفورية -->
    <script defer src="https://jsdelivr.net"></script>
    <!-- Lucide Icons للأيقونات الاحترافية -->
    <script src="https://unpkg.com"></script>
    <style>
        [x-cloak] { display: none !important; }
        .neon-shadow { box-shadow: 0 0 30px rgba(255, 90, 31, 0.4); }
        .mint-shadow { box-shadow: 0 0 30px rgba(16, 185, 129, 0.3); }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

    <!-- 1. شاشة الـ Splash Screen الترحيبية -->
    <div x-show="showSplash" 
         x-transition:leave="transition ease-in duration-500 transform opacity-0 scale-95"
         class="fixed inset-0 bg-slate-950 flex flex-col justify-center items-center z-50 text-white select-none">
        <div class="w-24 h-24 bg-[#FF5A1F] rounded-3xl flex items-center justify-center neon-shadow mb-4 animate-bounce">
            <i data-lucide="compass" class="w-12 h-12 text-white animate-spin"></i>
        </div>
        <h1 class="text-3xl font-black tracking-wider text-[#FF5A1F]">ترافل إكس | TravelX</h1>
        <p class="text-slate-400 text-sm mt-2 font-light">Digital Travel Universe</p>
    </div>

    <!-- المحتوى الرئيسي بعد انتهاء شاشة العرض -->
    <div x-show="!showSplash" x-cloak>
        
        <!-- الهيدر العلوي الثابت مع زر تبديل اللغة -->
        <header class="sticky top-0 bg-white/80 backdrop-blur-md z-40 border-b border-slate-100 px-4 py-3 flex justify-between items-center shadow-xs">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-[#FF5A1F] rounded-lg flex items-center justify-center text-white font-bold text-lg">X</div>
                <span class="font-black text-xl tracking-tight text-slate-900" x-text="t('appName')"></span>
            </div>
            <button @click="toggleLang()" class="flex items-center gap-1 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full text-xs font-bold transition-colors cursor-pointer">
                <i data-lucide="globe" class="w-4 h-4 text-[#10B981]"></i>
                <span x-text="lang === 'ar' ? 'English' : 'العربية'"></span>
            </button>
        </header>

        <!-- جسم التطبيق المتنقل المخصص للهواتف ذو عرض محدد -->
        <main class="max-w-md mx-auto px-4 pt-4">

            <!-- 🏠 التبويب الأول: الصفحة الرئيسية -->
            <div x-show="currentTab === 'home'" x-transition class="space-y-6">
                
                <!-- بانل الإعلانات الذكي المكون من 3 صور ونصوص متغيرة -->
                <div class="relative h-40 bg-gradient-to-r from-slate-900 to-slate-800 rounded-2xl overflow-hidden shadow-md flex items-center p-6 text-white">
                    <div class="absolute inset-0 opacity-45 bg-cover bg-center" style="background-image: url('https://unsplash.com');"></div>
                    <div class="relative z-10 space-y-2 max-w-[85%]">
                        <span class="bg-[#10B981] text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">PROMO</span>
                        <p class="text-base font-bold leading-tight" x-text="t('ads')[currentAdIndex]"></p>
                    </div>
                    <!-- قواطع النقاط السفلية للإعلان -->
                    <div class="absolute bottom-3 flex gap-1.5 justify-center w-full left-0 right-0 z-20">
                        <template x-for="(ad, idx) in t('ads')">
                            <div class="w-2 h-2 rounded-full transition-all" :class="idx === currentAdIndex ? 'bg-[#FF5A1F] w-4' : 'bg-white/50'"></div>
                        </template>
                    </div>
                </div>

                <!-- دوائر الخدمات السريعة الرقمية -->
                <div class="grid grid-cols-4 gap-2 text-center">
                    <div @click="currentTab = 'services'" class="flex flex-col items-center cursor-pointer group">
                        <div class="w-14 h-14 bg-orange-100 text-[#FF5A1F] rounded-full flex items-center justify-center shadow-xs transition-transform group-hover:scale-105">
                            <i data-lucide="car" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-semibold mt-2 text-slate-700 truncate w-full" x-text="t('airportPickup')"></span>
                    </div>
                    <div @click="currentTab = 'services'" class="flex flex-col items-center cursor-pointer group">
                        <div class="w-14 h-14 bg-emerald-100 text-[#10B981] rounded-full flex items-center justify-center shadow-xs transition-transform group-hover:scale-105">
                            <i data-lucide="calendar" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-semibold mt-2 text-slate-700 truncate w-full" x-text="t('localEvents')"></span>
                    </div>
                    <div @click="currentTab = 'services'" class="flex flex-col items-center cursor-pointer group">
                        <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center shadow-xs transition-transform group-hover:scale-105">
                            <i data-lucide="compass" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-semibold mt-2 text-slate-700 truncate w-full" x-text="t('tourGuide')"></span>
                    </div>
                    <div @click="currentTab = 'services'" class="flex flex-col items-center cursor-pointer group">
                        <div class="w-14 h-14 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center shadow-xs transition-transform group-hover:scale-105">
                            <i data-lucide="user" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-semibold mt-2 text-slate-700 truncate w-full" x-text="t('hotelRes')"></span>
                    </div>
                </div>

                <!-- خلاصة منشورات وريلز المشتركين -->
                <div class="space-y-4">
                    <template x-for="post in posts" :key="post.id">
                        <div class="bg-white rounded-2xl overflow-hidden shadow-xs border border-slate-100">
                            <!-- رأس المنشور -->
                            <div class="p-3 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <img :src="post.avatar" class="w-9 h-9 rounded-full object-cover border border-slate-200" />
                                    <div>
                                        <h4 class="font-bold text-sm text-slate-900" x-text="post.user"></h4>
                                        <p class="text-[10px] text-slate-400 flex items-center gap-0.5">
                                            <i data-lucide="map-pin" class="w-3 h-3 text-[#FF5A1F]"></i>
                                            <span x-text="post.location"></span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- صورة الريل الفاخرة مع زر الحجز المباشر -->
                            <div class="relative aspect-square bg-slate-900">
                                <img :src="post.videoThumb" class="w-full h-full object-cover" />
                                <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                                
                                <button @click="currentTab = 'services'" class="absolute bottom-3 left-3 right-3 bg-[#FF5A1F] text-white py-2.5 px-4 rounded-xl text-xs font-bold shadow-lg flex items-center justify-center gap-2 cursor-pointer active:scale-95 transition-transform">
                                    <i data-lucide="car" class="w-4 h-4"></i>
                                    <span x-text="t('bookNow')"></span>
                                </button>
                            </div>

                            <!-- التفاعلات واللايكات -->
                            <div class="p-3 flex items-center justify-between text-slate-600 border-t border-slate-50">
                                <div class="flex items-center gap-4">
                                    <button @click="toggleLike(post.id)" class="flex items-center gap-1 hover:text-red-500 transition-colors cursor-pointer">
                                        <i data-lucide="heart" :class="post.isLiked ? 'fill-red-500 text-red-500' : ''" class="w-5 h-5"></i>
                                        <span class="text-xs font-bold" x-text="post.likes"></span>
                                    </button>
                                    <div class="flex items-center gap-1">
                                        <i data-lucide="message-circle" class="w-5 h-5"></i>
                                        <span class="text-xs font-bold" x-text="post.comments"></span>
                                    </div>
                                </div>
                                <i data-lucide="share-2" class="w-5 h-5 cursor-pointer hover:text-[#10B981]"></i>
                            </div>
