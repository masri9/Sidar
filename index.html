<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlanta's Best Barber</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --bg-dark: #0d0d0d;
    --bg-charcoal: #2b2b2b;
    --gold: #c9a24b;
    --gold-soft: #e4c98a;
    --ivory: #f3ede1;
    --line: rgba(243,237,225,0.16);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(22px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  body{
    font-family:'Inter', sans-serif;
    color:var(--ivory);
    background:
      radial-gradient(circle at 50% 35%, var(--bg-charcoal) 0%, var(--bg-dark) 65%, #050505 100%);
    min-height:100vh;
    overflow-x:hidden;
  }

  a{ color:inherit; text-decoration:none; }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:1.5rem 1.5rem 0;
  }

  .logo{
    font-family:'UnifrakturMaguntia', serif;
    font-size:2.4rem;
    color:var(--gold-soft);
    letter-spacing:1px;
    opacity:0;
    animation:fadeUp 0.8s ease 0.1s forwards;
  }

  nav{
    margin-top:1.6rem;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:2.2rem;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:0.9rem 1rem;
  }

  nav a{
    font-size:0.72rem;
    letter-spacing:0.18em;
    color:var(--ivory);
    opacity:0.8;
    transition:opacity 0.2s ease, color 0.2s ease;
  }

  nav a:hover{ opacity:1; color:var(--gold-soft); }

  /* ---------- HERO ---------- */
  .hero-section{
    position:relative;
    overflow:hidden;
  }

  .hero-section .bg-image{
    position:absolute;
    inset:0;
    /* Replace with your own hero background image */
    background: url('https://plain-eeur-prod-public.komododecks.com/202609/14/Ei1iXFkXhi2EMDC5ZT9E/image.jpg') center/cover no-repeat;
    z-index:0;
    animation:kenBurns 18s ease-in-out infinite alternate;
  }

  @keyframes kenBurns{
    from{ transform:scale(1); }
    to{ transform:scale(1.08); }
  }

  .hero-section .overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.3);
    z-index:1;
    opacity:0;
    animation:overlayFade 1.4s ease forwards;
  }

  @keyframes overlayFade{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  .hero{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:3rem;
    max-width:1200px;
    margin:0 auto;
    padding:0.5rem 2rem;
  }

  .hero-copy .eyebrow{
    font-size:0.75rem;
    letter-spacing:0.22em;
    color:var(--gold);
    margin-bottom:1.1rem;
    display:block;
    opacity:0;
    animation:fadeUp 0.8s ease 0.35s forwards;
  }

  .hero-copy h1{
    font-family:'Montserrat', sans-serif;
    font-weight:800;
    font-size:clamp(2.4rem, 5vw, 4.2rem);
    line-height:1.05;
    color:var(--ivory);
    opacity:0;
    animation:fadeUp 0.9s ease 0.5s forwards;
  }

  .hero-copy .cta{
    display:inline-block;
    margin-top:2.2rem;
    font-size:0.85rem;
    font-weight:600;
    letter-spacing:0.14em;
    color:var(--bg-dark);
    background:var(--gold-soft);
    padding:0.9rem 2.2rem;
    border-radius:2px;
    border:1px solid var(--gold-soft);
    box-shadow:0 10px 25px rgba(201,162,75,0.25);
    transition:transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    opacity:0;
    animation:fadeUp 0.8s ease 0.65s forwards;
  }

  .hero-copy .cta:hover{
    background:var(--gold);
    transform:translateY(-3px);
    box-shadow:0 14px 32px rgba(201,162,75,0.4);
  }

  /* Layered photo collage */
  .collage{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
  }

  .collage .frame{
    border:10px solid var(--ivory);
    border-radius:2px;
    box-shadow:
      0 25px 50px rgba(0,0,0,0.55),
      0 0 0 1px rgba(201,162,75,0.35);
    overflow:hidden;
    transition:transform 0.3s ease;
  }

  .collage img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .collage .top{
    position:absolute;
    top:0;
    right:0;
    width:60%;
    height:68%;
    z-index:2;
    opacity:0;
    animation:collageTop 0.9s ease 0.55s forwards;
  }

  .collage .bottom{
    position:absolute;
    bottom:0;
    left:0;
    width:56%;
    height:65%;
    z-index:1;
    opacity:0;
    animation:collageBottom 0.9s ease 0.8s forwards;
  }

  @keyframes collageTop{
    from{ opacity:0; transform:rotate(-2.5deg) translateY(-20px); }
    to{ opacity:1; transform:rotate(-2.5deg) translateY(0); }
  }

  @keyframes collageBottom{
    from{ opacity:0; transform:rotate(2deg) translateY(20px); }
    to{ opacity:1; transform:rotate(2deg) translateY(0); }
  }

  .collage .top:hover,
  .collage .bottom:hover{
    transform:rotate(0deg) scale(1.02);
  }

  /* ---------- ICON MENU ---------- */
  .looking-for{
    text-align:center;
    padding:2rem 1.5rem 5rem;
    margin-top:6rem;
  }

  .looking-for h2{
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:0.85rem;
    letter-spacing:0.25em;
    color:var(--ivory);
    opacity:0.85;
    margin-bottom:3rem;
    opacity:0;
    transform:translateY(20px);
    transition:opacity 0.7s ease, transform 0.7s ease;
  }

  .looking-for h2.in-view{
    opacity:0.85;
    transform:translateY(0);
  }

  .icon-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:2.6rem;
    max-width:900px;
    margin:0 auto;
  }

  .icon-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.9rem;
    width:110px;
    opacity:0;
    transform:translateY(24px);
    transition:opacity 0.6s ease, transform 0.6s ease;
  }

  .icon-item.in-view{
    opacity:1;
    transform:translateY(0);
  }

  .icon-item.in-view:nth-child(1){ transition-delay:0s; }
  .icon-item.in-view:nth-child(2){ transition-delay:0.1s; }
  .icon-item.in-view:nth-child(3){ transition-delay:0.2s; }
  .icon-item.in-view:nth-child(4){ transition-delay:0.3s; }
  .icon-item.in-view:nth-child(5){ transition-delay:0.4s; }
  .icon-item.in-view:nth-child(6){ transition-delay:0.5s; }

  .icon-circle{
    width:72px;
    height:72px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color 0.2s ease, transform 0.2s ease;
  }

  .icon-item:hover .icon-circle{
    border-color:var(--gold-soft);
    transform:translateY(-3px);
  }

  .icon-circle svg{
    width:26px;
    height:26px;
    stroke:var(--gold-soft);
    fill:none;
    stroke-width:1.6;
  }

  .icon-item span{
    font-size:0.68rem;
    letter-spacing:0.12em;
    color:var(--ivory);
    opacity:0.75;
    text-align:center;
  }

  /* ---------- BOOKING ---------- */
  .book-section{
    max-width:560px;
    margin:0 auto 5rem;
    padding:0 1.5rem;
  }

  .book-section h2{
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:1.4rem;
    text-align:center;
    margin-bottom:0.4rem;
  }

  .book-section .book-sub{
    text-align:center;
    font-size:0.82rem;
    opacity:0.65;
    margin-bottom:2rem;
  }

  .book-day-group{ margin-bottom:1.5rem; }

  .book-day-title{
    font-size:0.78rem;
    letter-spacing:0.08em;
    color:var(--gold-soft);
    margin-bottom:0.7rem;
    border-bottom:1px solid var(--line);
    padding-bottom:0.4rem;
  }

  .book-slots{
    display:flex;
    flex-wrap:wrap;
    gap:0.6rem;
  }

  .book-slot-btn{
    padding:0.55rem 1rem;
    border-radius:6px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.03);
    color:var(--ivory);
    font-size:0.85rem;
    cursor:pointer;
    transition:border-color 0.2s ease, background 0.2s ease;
    font-family:'Inter', sans-serif;
  }

  .book-slot-btn:hover{ border-color:var(--gold-soft); }

  .book-slot-btn.selected{
    background:var(--gold-soft);
    color:var(--bg-dark);
    border-color:var(--gold-soft);
    font-weight:600;
  }

  .book-slot-btn.taken{
    opacity:0.35;
    text-decoration:line-through;
    cursor:not-allowed;
  }

  .book-empty{
    font-size:0.85rem;
    opacity:0.6;
    padding:1rem 0;
    text-align:center;
  }

  #book-form{
    margin-top:1.6rem;
    display:none;
    flex-direction:column;
    gap:0.9rem;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:10px;
    padding:1.4rem;
  }

  #book-form.show{ display:flex; }

  #book-form label{ font-size:0.78rem; opacity:0.8; }

  #book-form input{
    width:100%;
    padding:0.7rem 0.9rem;
    border-radius:6px;
    border:1px solid var(--line);
    background:rgba(0,0,0,0.3);
    color:var(--ivory);
    font-size:0.9rem;
    font-family:'Inter', sans-serif;
  }

  #book-form input:focus{ outline:1px solid var(--gold-soft); }

  .book-selected-line{
    font-size:0.85rem;
    opacity:0.75;
  }

  #book-submit-btn{
    margin-top:0.4rem;
    padding:0.85rem;
    border-radius:6px;
    border:none;
    background:var(--gold-soft);
    color:var(--bg-dark);
    font-weight:700;
    font-size:0.9rem;
    letter-spacing:0.05em;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.2s ease;
    font-family:'Inter', sans-serif;
  }

  #book-submit-btn:hover{ background:var(--gold); transform:translateY(-2px); }
  #book-submit-btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }

  #book-msg{
    text-align:center;
    margin-top:1rem;
    font-size:0.85rem;
    padding:0.8rem;
    border-radius:6px;
    display:none;
  }

  #book-msg.ok{ display:block; background:rgba(123,191,138,0.12); color:#7bbf8a; }
  #book-msg.err{ display:block; background:rgba(220,90,90,0.12); color:#e08a8a; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 860px){
    .hero{
      grid-template-columns:1fr;
      text-align:center;
      margin-top:2rem;
    }
    .hero-copy .eyebrow{ text-align:center; }
    .collage{
      max-width:340px;
      margin:0 auto;
      aspect-ratio:3/4;
    }
    nav{ gap:1.2rem 1.6rem; }
  }

  @media (max-width: 480px){
    .logo{ font-size:1.9rem; }
    nav a{ font-size:0.65rem; }
    .icon-item{ width:84px; }
    .icon-circle{ width:60px; height:60px; }
    .icon-circle svg{ width:22px; height:22px; }
  }
</style>
</head>

<script>
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });

  document.querySelectorAll('.icon-item, #looking-title').forEach(el => io.observe(el));
</script>

<script>
  // ============ وضع تجريبي / Demo mode ============
  // شغال حالياً ببيانات وهمية محفوظة بالمتصفح (localStorage) بدون أي Supabase حقيقي.
  // لما تجهزي، حطي بيانات مشروعك تحت وبدّلي DEMO_MODE لـ false.
  const DEMO_MODE = true;

  const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";

  const sb = DEMO_MODE ? null : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const LS_SLOTS = 'demo_slots_v1';
  const LS_BOOKINGS = 'demo_bookings_v1';
  const uid = () => 'id-' + Math.random().toString(36).slice(2, 10);

  const demoGetSlots = () => JSON.parse(localStorage.getItem(LS_SLOTS) || '[]');
  const demoSetSlots = (arr) => { localStorage.setItem(LS_SLOTS, JSON.stringify(arr)); window.dispatchEvent(new Event('demo-sync')); };
  const demoGetBookings = () => JSON.parse(localStorage.getItem(LS_BOOKINGS) || '[]');
  const demoSetBookings = (arr) => { localStorage.setItem(LS_BOOKINGS, JSON.stringify(arr)); window.dispatchEvent(new Event('demo-sync')); };

  function demoSeedIfEmpty(){
    if (demoGetSlots().length > 0) return;
    const slots = [];
    const today = new Date();
    for (let dayOffset = 0; dayOffset < 5; dayOffset++){
      const d = new Date(today);
      d.setDate(d.getDate() + dayOffset);
      const dateStr = d.toISOString().split('T')[0];
      for (let h = 10; h < 18; h++){
        slots.push({ id: uid(), slot_date: dateStr, slot_time: `${String(h).padStart(2,'0')}:00:00`, status: 'available' });
        slots.push({ id: uid(), slot_date: dateStr, slot_time: `${String(h).padStart(2,'0')}:30:00`, status: 'available' });
      }
    }
    if (slots[3]) slots[3].status = 'booked';
    if (slots[9]) slots[9].status = 'booked';
    demoSetSlots(slots);
  }

  function demoBookSlot(slotId, name, phone){
    const slots = demoGetSlots();
    const slot = slots.find(s => s.id === slotId);
    if (!slot || slot.status !== 'available'){
      return { success: false, message: 'هذه الساعة تم حجزها لتوّها من شخص آخر' };
    }
    slot.status = 'booked';
    demoSetSlots(slots);
    const bookings = demoGetBookings();
    const booking = { id: uid(), slot_id: slotId, customer_name: name, customer_phone: phone, status: 'pending', created_at: new Date().toISOString() };
    bookings.push(booking);
    demoSetBookings(bookings);
    return { success: true, message: 'تم الحجز بنجاح (تجريبي)، بانتظار تأكيد الحلاق' };
  }

  if (DEMO_MODE) demoSeedIfEmpty();

  let selectedSlotId = null;

  const bookContainer = document.getElementById('book-slots-container');
  const bookForm = document.getElementById('book-form');
  const bookMsg = document.getElementById('book-msg');
  const bookSubmitBtn = document.getElementById('book-submit-btn');

  const dayNames = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

  function formatSlotTime(t){
    const [h, m] = t.split(':');
    const hour = parseInt(h,10);
    const period = hour >= 12 ? 'م' : 'ص';
    const hour12 = ((hour % 12) || 12);
    return `${hour12}:${m} ${period}`;
  }

  async function loadBookSlots(){
    let data, error;

    if (DEMO_MODE){
      const today = new Date().toISOString().split('T')[0];
      data = demoGetSlots()
        .filter(s => s.slot_date >= today)
        .sort((a,b) => (a.slot_date + a.slot_time).localeCompare(b.slot_date + b.slot_time));
    } else {
      const today = new Date().toISOString().split('T')[0];
      const res = await sb.from('slots').select('*')
        .gte('slot_date', today)
        .order('slot_date', { ascending: true })
        .order('slot_time', { ascending: true });
      data = res.data; error = res.error;
    }

    if (error){
      bookContainer.innerHTML = `<p class="book-empty">صار خطأ بتحميل المواعيد. تأكدي من إعداد Supabase.</p>`;
      console.error(error);
      return;
    }

    if (!data || data.length === 0){
      bookContainer.innerHTML = `<p class="book-empty">ما في مواعيد متاحة حالياً، تواصلي معنا مباشرة.</p>`;
      return;
    }

    const byDay = {};
    data.forEach(slot => {
      if (!byDay[slot.slot_date]) byDay[slot.slot_date] = [];
      byDay[slot.slot_date].push(slot);
    });

    bookContainer.innerHTML = '';
    Object.keys(byDay).forEach(date => {
      const d = new Date(date + 'T00:00:00');
      const dayLabel = `${dayNames[d.getDay()]} — ${date}`;

      const group = document.createElement('div');
      group.className = 'book-day-group';
      group.innerHTML = `<div class="book-day-title">${dayLabel}</div>`;

      const slotsWrap = document.createElement('div');
      slotsWrap.className = 'book-slots';

      byDay[date].forEach(slot => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'book-slot-btn' + (slot.status === 'booked' ? ' taken' : '');
        btn.textContent = formatSlotTime(slot.slot_time);
        btn.disabled = slot.status === 'booked';
        btn.onclick = () => selectBookSlot(slot.id, `${dayLabel} — ${formatSlotTime(slot.slot_time)}`, btn);
        slotsWrap.appendChild(btn);
      });

      group.appendChild(slotsWrap);
      bookContainer.appendChild(group);
    });
  }

  function selectBookSlot(id, label, btnEl){
    document.querySelectorAll('.book-slot-btn.selected').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');
    selectedSlotId = id;
    document.getElementById('book-selected-label').textContent = label;
    bookForm.classList.add('show');
    bookMsg.className = '';
    bookMsg.textContent = '';
  }

  bookForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!selectedSlotId) return;

    const name = document.getElementById('book-name').value.trim();
    const phone = document.getElementById('book-phone').value.trim();
    if (!name || !phone) return;

    bookSubmitBtn.disabled = true;
    bookSubmitBtn.textContent = 'جاري الحجز...';

    let result;
    if (DEMO_MODE){
      result = demoBookSlot(selectedSlotId, name, phone);
    } else {
      const { data, error } = await sb.rpc('book_slot', {
        p_slot_id: selectedSlotId,
        p_customer_name: name,
        p_customer_phone: phone
      });
      result = (!error && data && data[0]) ? data[0] : { success: false, message: 'صار خطأ، حاولي مرة ثانية' };
    }

    bookSubmitBtn.disabled = false;
    bookSubmitBtn.textContent = 'تأكيد الحجز';

    if (!result.success){
      bookMsg.className = 'err';
      bookMsg.textContent = result.message;
      loadBookSlots();
      return;
    }

    bookMsg.className = 'ok';
    bookMsg.textContent = result.message;
    bookForm.classList.remove('show');
    bookForm.reset();
    selectedSlotId = null;
    loadBookSlots();
  });

  if (DEMO_MODE){
    window.addEventListener('demo-sync', loadBookSlots);
    window.addEventListener('storage', loadBookSlots);
  } else {
    sb.channel('slots-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'slots' }, loadBookSlots)
      .subscribe();
  }

  loadBookSlots();
</script>
</body>
</html>
